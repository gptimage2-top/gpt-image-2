name: Bug report
description: Report a broken page, workflow problem, wrong result, or browser issue.
title: "[Bug]: "
labels: ["type: bug", "status: needs triage"]
body:
  - type: input
    id: page
    attributes:
      label: Page URL
      placeholder: https://gptimage2.top/...
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Product area
      options:
        - Create
        - Image edit
        - Showcases
        - Pricing or credits
        - Account or billing
        - Landing page
        - Other
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Include expected result and actual result.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Browser, device, and locale
      placeholder: Chrome on Android, Safari on iPhone, Edge on Windows, en
